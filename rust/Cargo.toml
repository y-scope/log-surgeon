[package]
name = "log-surgeon"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = [
	"lib",
	"staticlib",
	"cdylib"
]

[profile.test]
opt-level = 2

[profile.release]
overflow-checks = true

[features]
# This crate produces two types of output:
# 1. A C library (staticlib) — used by C/C++ code, built with `cargo build`
# 2. A Python extension (.so) — used by Python, built with `maturin build`
#
# These two outputs need incompatible linker settings, so we can't enable both
# at once. We leave "default" empty here, and let each build tool enable only
# what it needs: maturin automatically enables the "python" feature (configured
# in pyproject.toml).
default = []
python = [
	"dep:pyo3",
	"pyo3/extension-module",
	"pyo3/macros",
]

[build-dependencies]
cbindgen = "0.29"

[dependencies]
nom = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.pyo3]
version = "0.27"
default-features = false
optional = true

[workspace]

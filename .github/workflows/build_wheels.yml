name: "build-wheels"

on:
  pull_request:
    paths:
      - ".github/workflows/build_wheels.yml"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/pyproject.toml"
      - "rust/rust-toolchain.toml"
      - "rust/src/**"
      - "rust/python/**"
  push:
    paths:
      - ".github/workflows/build_wheels.yml"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/pyproject.toml"
      - "rust/rust-toolchain.toml"
      - "rust/src/**"
      - "rust/python/**"
  schedule:
    # Run every Tuesday at 00:15 UTC
    - cron: "15 0 * * 2"
  workflow_dispatch:
    inputs:
      publish-to-pypi:
        description: "Publish wheels to PyPI"
        type: "boolean"
        default: false

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: "Build ${{ matrix.target }} (py${{ matrix.python }})"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - {os: "ubuntu-latest", target: "x86_64-unknown-linux-gnu", python: "3.9"}
          - {os: "ubuntu-latest", target: "x86_64-unknown-linux-gnu", python: "3.10"}
          - {os: "ubuntu-latest", target: "x86_64-unknown-linux-gnu", python: "3.11"}
          - {os: "ubuntu-latest", target: "x86_64-unknown-linux-gnu", python: "3.12"}
          - {os: "ubuntu-latest", target: "x86_64-unknown-linux-gnu", python: "3.13"}

          # Linux aarch64
          - {os: "ubuntu-22.04-arm", target: "aarch64-unknown-linux-gnu", python: "3.9"}
          - {os: "ubuntu-22.04-arm", target: "aarch64-unknown-linux-gnu", python: "3.10"}
          - {os: "ubuntu-22.04-arm", target: "aarch64-unknown-linux-gnu", python: "3.11"}
          - {os: "ubuntu-22.04-arm", target: "aarch64-unknown-linux-gnu", python: "3.12"}
          - {os: "ubuntu-22.04-arm", target: "aarch64-unknown-linux-gnu", python: "3.13"}

          # macOS universal2 (x86_64 + arm64 fat binaries)
          - {os: "macos-14", target: "universal2-apple-darwin", python: "3.9"}
          - {os: "macos-14", target: "universal2-apple-darwin", python: "3.10"}
          - {os: "macos-14", target: "universal2-apple-darwin", python: "3.11"}
          - {os: "macos-14", target: "universal2-apple-darwin", python: "3.12"}
          - {os: "macos-14", target: "universal2-apple-darwin", python: "3.13"}

    steps:
      - uses: "actions/checkout@v4"

      - uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python }}"

      - name: "Build wheel"
        uses: "PyO3/maturin-action@v1"
        with:
          target: "${{ matrix.target }}"
          args: "--release --out dist --interpreter ${{ matrix.python }}"
          manylinux: "auto"
          working-directory: "rust"

      - uses: "actions/upload-artifact@v4"
        with:
          name: "wheel-${{ matrix.target }}-py${{ matrix.python }}"
          path: "rust/dist/*.whl"
          retention-days: 7
          if-no-files-found: "error"

  test:
    needs: ["build"]
    name: "Test ${{ matrix.target }} (py${{ matrix.python }})"
    runs-on: "${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: "ubuntu-latest", target: "x86_64-unknown-linux-gnu", python: "3.9"}
          - {os: "ubuntu-latest", target: "x86_64-unknown-linux-gnu", python: "3.13"}
          - {os: "ubuntu-22.04-arm", target: "aarch64-unknown-linux-gnu", python: "3.12"}
          - {os: "macos-14", target: "universal2-apple-darwin", python: "3.12"}

    steps:
      - uses: "actions/checkout@v4"

      - uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python }}"

      - uses: "actions/download-artifact@v4"
        with:
          name: "wheel-${{ matrix.target }}-py${{ matrix.python }}"
          path: "dist"

      - name: "Install and test wheel"
        run: |
          pip install dist/*.whl
          python -c "
          from log_surgeon import Parser, LogEvent, Match, LogType
          print('Import OK')
          "
          python -m unittest discover rust/tests/python

  combine-wheels:
    needs: ["build", "test"]
    name: "Combine wheels"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/download-artifact@v4"
        with:
          path: "/tmp/wheels"
          pattern: "wheel-*"
          merge-multiple: true

      - uses: "actions/upload-artifact@v4"
        with:
          name: "all-wheels"
          path: "/tmp/wheels"
          retention-days: 7
          if-no-files-found: "error"

  publish:
    needs: ["combine-wheels"]
    name: "Publish to PyPI"
    runs-on: "ubuntu-latest"
    if: "inputs.publish-to-pypi == true"
    environment:
      name: "pypi"
    permissions:
      id-token: "write"
    steps:
      - uses: "actions/download-artifact@v4"
        with:
          name: "all-wheels"
          path: "dist"

      - name: "List wheels to publish"
        run: "ls -la dist/"

      - uses: "pypa/gh-action-pypi-publish@release/v1"
        with:
          packages-dir: "dist/"

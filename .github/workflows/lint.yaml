name: "lint"

on:
  pull_request:
  push:
  schedule:
    # Run daily at 00:15 UTC (the 15 is to avoid periods of high load)
    - cron: "15 0 * * *"
  workflow_dispatch:

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  # Cancel in-progress jobs for efficiency
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        os:
          - "macos-15"
          - "ubuntu-24.04"
    runs-on: "${{matrix.os}}"
    steps:
      - uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd"  # v6.0.2
        with:
          submodules: "recursive"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-python"
        with:
          version: "3.8"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-go-task"

      - uses: "./tools/yscope-dev-utils/exports/github/actions/install-uv"

      - if: "matrix.os == 'macos-15'"
        name: "Set SDKROOT so clang-tidy can find the Xcode SDK."
        run: |
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV

      # We use clang for linting so CMake doesn't generate compile_commands.json with any gcc
      # specific flags that would confuse clang-tidy.
      - if: "matrix.os == 'ubuntu-24.04'"
        name: "Install clang."
        run: |-
          curl https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo ln -s /usr/bin/clang-21 /usr/local/bin/cc
          sudo ln -s /usr/bin/clang++-21 /usr/local/bin/c++

      - name: "Run lint task"
        run: "task lint:check"
